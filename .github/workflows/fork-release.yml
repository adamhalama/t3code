name: Fork release

# fork: builds the adamhalama/t3code desktop app and publishes it as a GitHub
# Release that the fork's in-app updater follows (fork/README.md#pipelines).
# Pull requests into fork/main only build and upload the installer as an artifact.
# Packaging reuses upstream's release-desktop.yml unchanged and passes it no
# secrets, so nothing is signed.

on:
  push:
    branches: [fork/main]
  pull_request:
    branches: [fork/main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (only from fork/main)"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to build. Defaults to the triggering commit."
        required: false
        default: ""
        type: string
      publish:
        required: false
        default: true
        type: boolean
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}
      published:
        value: ${{ jobs.assemble.outputs.published }}

permissions:
  # The Windows build reads this run's artifact list to wait for the Linux CLI
  # archive it embeds as the WSL runtime (see release-desktop.yml).
  actions: read
  contents: read

# Publishing runs on fork/main go one at a time from `prepare` on, so each one
# picks its version after the previous release exists. A newer queued run
# replaces an older queued one; it ships the same commits. PR builds run freely.
concurrency:
  group: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/fork/main' && 'fork-release-publish' || format('fork-release-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.version.outputs.ref }}
      version: ${{ steps.version.outputs.version }}
      upstream_version: ${{ steps.version.outputs.upstream_version }}
      publish: ${{ steps.version.outputs.publish }}
      clerk_publishable_key: ${{ steps.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.public_config.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      # <upstream>-fork.<n>: n is one past the highest release or tag already
      # made for this upstream version. Builds that do not publish take the
      # same number; only a published release claims it.
      - id: version
        name: Resolve version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'push' || inputs.publish == true }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          upstream="$(tr -d '[:space:]' < fork/UPSTREAM_VERSION)"
          names="$(
            gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName'
            git ls-remote --tags --refs origin "refs/tags/v${upstream}-fork.*" | sed 's#.*refs/tags/##'
          )"
          version="$(printf '%s\n' "$names" | node scripts/fork-version.ts next --upstream "$upstream")"

          publish=false
          if [[ "$GITHUB_REF" == "refs/heads/fork/main" && "$PUBLISH_REQUESTED" == "true" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            publish=true
            # A release tag already on this commit means it shipped (for example
            # a sync push that also called this workflow); do not ship it twice.
            released="$(git ls-remote --tags origin "refs/tags/v${upstream}-fork.*" | awk -v sha="$sha" '$1 == sha { sub(".*refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2; exit }')"
            if [[ -n "$released" ]]; then
              echo "::notice::$sha is already released as $released; building without publishing."
              publish=false
            fi
          fi

          echo "Building $version from $sha (upstream v$upstream, publish=$publish)."
          {
            echo "ref=$sha"
            echo "version=$version"
            echo "upstream_version=$upstream"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      # The same public T3 Connect identifiers a source build uses (.env.example),
      # which is also what upstream's preview builds ship.
      - id: public_config
        name: Resolve T3 Connect public config
        shell: bash
        run: |
          set -euo pipefail
          value() { sed -n "s/^$1=//p" .env.example | head -n 1; }
          {
            echo "clerk_publishable_key=$(value T3CODE_CLERK_PUBLISHABLE_KEY)"
            echo "clerk_jwt_template=$(value T3CODE_CLERK_JWT_TEMPLATE)"
            echo "clerk_cli_oauth_client_id=$(value T3CODE_CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "relay_url=$(value T3CODE_RELAY_URL)"
          } >> "$GITHUB_OUTPUT"

  # Server, web client, and Electron main, built once for every platform job.
  # Mirrors build_bundle in release.yml without the production tracing config.
  bundle:
    name: Build JS bundle
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.prepare.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.prepare.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.prepare.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.prepare.outputs.relay_url }}
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # One release-desktop.yml call per target. Linux x64 is always built: its CLI
  # archive is the WSL runtime the Windows installer embeds, and the Windows job
  # waits for a job named "... Build Linux <arch>". Only platforms listed in
  # PUBLISHED_PLATFORMS (assemble job) are released.
  desktop:
    name: Desktop ${{ matrix.label }}
    needs: [prepare, bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-latest
            verify_runner: ""
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - label: Windows x64
            runner: ubuntu-latest
            verify_runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.prepare.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.prepare.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.prepare.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.prepare.outputs.relay_url }}
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      verify_runner: ${{ matrix.verify_runner }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      cli_archive: true
      # The launch check runs the AppImage as `t3code`; the fork names it t3code-fork.
      launch_check: false

  assemble:
    name: ${{ needs.prepare.outputs.publish == 'true' && 'Publish release' || 'Collect installer' }}
    needs: [prepare, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published || 'false' }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      UPSTREAM_VERSION: ${{ needs.prepare.outputs.upstream_version }}
      PUBLISHED_PLATFORMS: win
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: desktop-artifacts

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          for platform in $PUBLISHED_PLATFORMS; do
            for dir in desktop-artifacts/desktop-"$platform"-*; do
              cp "$dir"/* release-assets/
            done
          done
          rm -f release-assets/builder-debug.yml

          # release-desktop.yml suffixes the Windows manifest per arch; with one
          # Windows arch it is the feed manifest itself. A second arch needs
          # scripts/merge-update-manifests.ts as in release.yml.
          win_manifests=(release-assets/*-win-*.yml)
          if [[ ${#win_manifests[@]} -gt 1 ]]; then
            echo "Several Windows manifests (${win_manifests[*]}); merge them before publishing." >&2
            exit 1
          fi
          for manifest in "${win_manifests[@]}"; do
            mv "$manifest" "${manifest%-win-*.yml}.yml"
          done

          ls -la release-assets
          test -f release-assets/latest.yml
          grep -qx "version: $VERSION" release-assets/latest.yml
          exes=(release-assets/*.exe)
          test ${#exes[@]} -eq 1
          test -f "${exes[0]}.blockmap"
          grep -q "path: $(basename "${exes[0]}")" release-assets/latest.yml
          if grep -q '^publisherName' release-assets/latest.yml; then
            echo "Unexpected publisherName: the fork ships unsigned builds." >&2
            exit 1
          fi
          cat release-assets/latest.yml

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: t3code-fork-${{ needs.prepare.outputs.version }}
          path: release-assets/*
          if-no-files-found: error

      # electron-updater on the "latest" channel reads releases/latest, so the
      # release must be published, not a prerelease, and marked latest.
      - id: publish
        name: Publish GitHub release
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.ref }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$tag was published by another run while this one built; rerun to take the next number."
            exit 1
          fi
          cat > release-notes.md <<EOF
          T3 Code (Fork) $VERSION, built from [\`${SHA:0:12}\`](https://github.com/$GITHUB_REPOSITORY/commit/$SHA) on upstream [v$UPSTREAM_VERSION](https://github.com/pingdotgg/t3code/releases/tag/v$UPSTREAM_VERSION).

          Unsigned Windows x64 build. Installs as "T3 Code (Fork)" next to official T3 Code and updates itself from this repository's releases. Windows SmartScreen warns on first install: More info -> Run anyway. See [fork/README.md](https://github.com/$GITHUB_REPOSITORY/blob/fork/main/fork/README.md).
          EOF
          gh release create "$tag" release-assets/* \
            -R "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "T3 Code (Fork) $VERSION" \
            --notes-file release-notes.md \
            --latest
          echo "published=true" >> "$GITHUB_OUTPUT"
